name: Feature request
description: Propose an improvement to a BugTraceAI component or workflow.
title: "[Feature]: "
body:
  - type: input
    id: component
    attributes:
      label: Component or workflow
      placeholder: "CLI, WEB, API, Launcher, integration or documentation"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current workflow and where it becomes difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what the user should be able to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
